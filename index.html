<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz Application</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Online Quiz Application</h1>
  </header>
  <!-- LOGIN / SIGNUP -->
<section id="auth-section" class="card">
  <h2>Login / Signup</h2>
  <input id="auth-name" type="text" placeholder="Name (signup ke liye)" />
  <input id="auth-email" type="email" placeholder="Email" />
  <input id="auth-password" type="password" placeholder="Password" />
  <div style="display:flex; gap:10px; margin-top:10px;">
    <button id="login-btn" class="btn">Login</button>
    <button id="signup-btn" class="btn">Signup</button>
  </div>
  <p id="auth-msg"></p>
  <p id="welcome-msg"></p>
</section>

  <main class="container">
    <section id="landing-section" class="card hidden">
      <h2>Welcome to the quiz!</h2>
      <p>Test your knowledge with a short quiz about technology.</p>
      <h3>How to play</h3>
      <ol class="instructions">
        <li>Read each question.</li>
        <li>Select one answer.</li>
        <li>Click Next to continue.</li>
      </ol>
      <button id="start-button" type="button">Start Quiz</button>
    </section>

    <section id="quiz-section" class="card" hidden>
      <p id="question-number" class="question-number"></p>
      <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <h2 id="question-text"></h2>-
      <div id="options-container" class="options-grid"></div>
      <p id="feedback" class="feedback-message" aria-live="polite"></p>
      <p id="answer-message" hidden>Please select an answer</p>
      <button id="next-button" type="button">Next</button>
    </section>

    <section id="result-section" class="card" hidden>
      <h2>Quiz completed</h2>
      <p id="score-text" class="result-score"></p>
      <button id="restart-button" type="button">Try Again</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>Online Quiz Application</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
